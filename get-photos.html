<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Get monument photos</title>
<style>body{font:15px/1.5 system-ui,Segoe UI,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;color:#222}
button{font:600 16px system-ui;padding:12px 22px;border:0;border-radius:999px;background:#AE3820;color:#fff;cursor:pointer}
button:disabled{opacity:.5}#log{margin-top:18px;font:13px/1.6 Consolas,monospace;white-space:pre-wrap}.ok{color:#2c7f45}.bad{color:#b00}</style></head><body>
<h2>Download the monument photos</h2>
<p>Click the button, then choose the <b>photos</b> folder inside your project folder (Biennale map 3D -N &gt; photos) and allow Chrome/Edge to save files there.
It downloads the 27 free-licence photos from Wikimedia Commons, one every second. Photos already downloaded are kept.</p>
<button id="go">Choose the photos folder and download</button>
<div id="log"></div>
<script>
const ITEMS = [{"f": "pq-bara-gate.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Bada_Darwaza_of_Purana_Qila_in_Delhi.JPG/500px-Bada_Darwaza_of_Purana_Qila_in_Delhi.JPG"}, {"f": "pq-entry.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Bara_Darwaza%2C_Purana_Qila%2C_Delhi%2C_India_%282018%29.jpg/500px-Bara_Darwaza%2C_Purana_Qila%2C_Delhi%2C_India_%282018%29.jpg"}, {"f": "pq-humayun.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Humayun_Gate_at_Purana_Qila_Delhi.JPG/500px-Humayun_Gate_at_Purana_Qila_Delhi.JPG"}, {"f": "pq-talaqi.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Talaqi_Darwaza%2C_Purana_Qila.jpg/500px-Talaqi_Darwaza%2C_Purana_Qila.jpg"}, {"f": "pq-mosque.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Qila-i-kuhna_mosque.jpg/500px-Qila-i-kuhna_mosque.jpg"}, {"f": "pq-shermandal.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Sher_Mandal%2C_Purana_Qila_%2801%29.jpg/500px-Sher_Mandal%2C_Purana_Qila_%2801%29.jpg"}, {"f": "pq-baoli.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Baoli_inside_Purana_Qila_with_Qila-i-Kohna_in_background.jpg/500px-Baoli_inside_Purana_Qila_with_Qila-i-Kohna_in_background.jpg"}, {"f": "pq-museum.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Entrance_of_the_Archaeological_Museum%2C_Purana_Qila_%2801%29.jpg/500px-Entrance_of_the_Archaeological_Museum%2C_Purana_Qila_%2801%29.jpg"}, {"f": "pq-excavation.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Artefacts_-_ASI_Excavation_-_Old_Fort_Complex_-_New_Delhi_2014-05-13_2899-2901_Archive.TIF/lossy-page1-500px-Artefacts_-_ASI_Excavation_-_Old_Fort_Complex_-_New_Delhi_2014-05-13_2899-2901_Archive.TIF.jpg"}, {"f": "pq-lake.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Purana_Quila_%28The_Old_Fort%29.jpg/500px-Purana_Quila_%28The_Old_Fort%29.jpg"}, {"f": "rf-lahori.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Lahori_Gate_%28Red_Fort%29%2C_Delhi%2C_India_%282017%29.jpg/500px-Lahori_Gate_%28Red_Fort%29%2C_Delhi%2C_India_%282017%29.jpg"}, {"f": "rf-entry.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Lahori_Gate_Red_Fort_New_Delhi.jpg/500px-Lahori_Gate_Red_Fort_New_Delhi.jpg"}, {"f": "rf-chhatta.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Chhatta_Chowk_market_inside_the_Red_fort_01.jpg/500px-Chhatta_Chowk_market_inside_the_Red_fort_01.jpg"}, {"f": "rf-naubat.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/20191203_Naubat_Khana%2C_Red_Fort%2C_Delhi_0453_6340_DxO.jpg/500px-20191203_Naubat_Khana%2C_Red_Fort%2C_Delhi_0453_6340_DxO.jpg"}, {"f": "rf-diwaniam.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Diwan-i-Aam%2C_Red_Fort%2C_Delhi.JPG/500px-Diwan-i-Aam%2C_Red_Fort%2C_Delhi.JPG"}, {"f": "rf-mumtaz.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Muntaz_Mahal_Red_Fort_Delhi_India_-_panoramio.jpg/500px-Muntaz_Mahal_Red_Fort_Delhi_India_-_panoramio.jpg"}, {"f": "rf-rang.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Rang_Mahal%2C_Red_Fort%2C_Delhi_02.JPG/500px-Rang_Mahal%2C_Red_Fort%2C_Delhi_02.JPG"}, {"f": "rf-khas.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Delhi%2C_India%2C_Khas_Mahal%2C_Red_Fort.jpg/500px-Delhi%2C_India%2C_Khas_Mahal%2C_Red_Fort.jpg"}, {"f": "rf-diwanikhas.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/20191203_Diwan-i-Khas%2C_Red_Fort%2C_Delhi_0503_6358_DxO.jpg/500px-20191203_Diwan-i-Khas%2C_Red_Fort%2C_Delhi_0503_6358_DxO.jpg"}, {"f": "rf-hammam.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Hammam_khana_in_Red_Fort%2C_Delhi_02.jpg/500px-Hammam_khana_in_Red_Fort%2C_Delhi_02.jpg"}, {"f": "rf-moti.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/20191203_Moti_Masjid%2C_Red_Fort%2C_Delhi_0502_6354_DxO.jpg/500px-20191203_Moti_Masjid%2C_Red_Fort%2C_Delhi_0502_6354_DxO.jpg"}, {"f": "rf-hayat.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Sawan_Pavilion_-_North_Facade_-_Hayat-Bakhsh-Bag_-_Red_Fort_-_Delhi_2014-05-13_3355.JPG/500px-Sawan_Pavilion_-_North_Facade_-_Hayat-Bakhsh-Bag_-_Red_Fort_-_Delhi_2014-05-13_3355.JPG"}, {"f": "rf-zafar.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/20191203_Zafar_Mahal%2C_Red_Fort%2C_Delhi_0518_6389_DxO.jpg/500px-20191203_Zafar_Mahal%2C_Red_Fort%2C_Delhi_0518_6389_DxO.jpg"}, {"f": "rf-shahburj.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Shah_Burj_Pavilion_-_Southern_View_-_Red_Fort_-_Delhi_2014-05-13_3382.JPG/500px-Shah_Burj_Pavilion_-_Southern_View_-_Red_Fort_-_Delhi_2014-05-13_3382.JPG"}, {"f": "rf-baoli.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Red_Fort_Baoli.jpg/500px-Red_Fort_Baoli.jpg"}, {"f": "rf-kranti.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/PXL_20231129_094544810Archaeological_Museum_Red_Fort_Lal_Qila%2C_Old_Delhi%2C_Delhi%2C_110006_07.jpg/500px-PXL_20231129_094544810Archaeological_Museum_Red_Fort_Lal_Qila%2C_Old_Delhi%2C_Delhi%2C_110006_07.jpg"}, {"f": "rf-delhi.jpg", "u": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Delhi_Gate%2C_Red_Fort%2C_Delhi.jpg/500px-Delhi_Gate%2C_Red_Fort%2C_Delhi.jpg"}];
const log = (t, c) => { const s = document.createElement('div'); if(c) s.className = c; s.textContent = t; document.getElementById('log').appendChild(s); };
document.getElementById('go').onclick = async () => {
  if(!window.showDirectoryPicker){ log('This browser cannot save into a folder. Please open this file in Chrome or Edge.', 'bad'); return; }
  let dir; try{ dir = await window.showDirectoryPicker({mode:'readwrite'}); }catch(e){ log('No folder chosen.', 'bad'); return; }
  document.getElementById('go').disabled = true; let ok = 0, bad = 0;
  for(const it of ITEMS){
    try{
      try{ const fh = await dir.getFileHandle(it.f); const f = await fh.getFile(); if(f.size > 10000 && f.type !== 'text/html'){ const head = new Uint8Array(await f.slice(0,3).arrayBuffer()); if(head[0] === 0xFF && head[1] === 0xD8){ log('kept     ' + it.f, 'ok'); ok++; continue; } } }catch(e){}
      let r, tries = 0; do{ r = await fetch(it.u, {cache:'no-store'}); if(r.status === 429){ tries++; log('busy, waiting… ' + it.f); await new Promise(z => setTimeout(z, 8000)); } }while(r.status === 429 && tries < 6);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const b = await r.blob(); if(!/^image\//.test(b.type)) throw new Error('not an image');
      const fh = await dir.getFileHandle(it.f, {create:true}); const w = await fh.createWritable(); await w.write(b); await w.close();
      log('saved    ' + it.f + '  (' + Math.round(b.size/1024) + ' KB)', 'ok'); ok++;
    }catch(e){ log('FAILED   ' + it.f + '  ' + e.message, 'bad'); bad++; }
    await new Promise(z => setTimeout(z, 1200));
  }
  log('\nDone: ' + ok + ' photos ready' + (bad ? ', ' + bad + ' failed - click the button again to retry them' : '') + '. Tell Claude they are ready.', bad ? 'bad' : 'ok');
  document.getElementById('go').disabled = false;
};
</script></body></html>
